<div *ngIf="magasin" class="magasin-container">
  <div class="magasin-header">
    <img [src]="magasin.image" alt="Image du magasin" class="header-image" />
    <div class="overlay">
      <div class="header-content">
        <h1>{{ magasin.nom }}</h1>
        <p>{{ magasin.telephone }}</p>
        <p>{{ magasin.ville }}</p>
        <p>{{ magasin.localisation }}</p>
      </div>
    </div>
  </div>

  <ng-template #errorTemplate>
    <p class="error">{{ error || 'Aucun magasin trouvé.' }}</p>
  </ng-template>

  <div *ngIf="produits.length > 0">
    <h2 class="section-title">Les produits disponibles</h2>
    <div class="product-list">
      <div *ngFor="let produit of produits" class="product-card">
        <img [src]="produit.imagePrincipale" alt="{{ produit.titre }}" class="product-image" />
        
        <h3>{{ produit.titre }}</h3>
        <p><strong>Prix:</strong> {{ produit.prix }} MAD</p>
        
        <button class="details-button" [routerLink]="['/produit', produit.idProduit]">
          Voir Détails
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="produits.length === 0">
    <p>Aucun produit disponible dans ce magasin pour le moment.</p>
  </div>
</div>

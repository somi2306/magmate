<div *ngIf="magasin" class="magasin-container">
  <div class="magasin-header">
    <img [src]="magasin.image" alt="Image du magasin" class="header-image" />
    <div class="overlay">
      <div class="header-content">
        <h1>{{ magasin.nom }}</h1>
        <p><i class="fas fa-phone"></i> {{ magasin.telephone }}</p>
        <p><i class="fas fa-city"></i> {{ magasin.ville }}</p>
        <p><i class="fas fa-map-marker-alt"></i> {{ magasin.localisation }}</p>
      </div>
    </div>
  </div>

  <div class="magasin-buttons">
    <button class="delete-magasin-btn" (click)="deleteMagasin(magasin.idMagasin)">
      <i class="fas fa-trash"></i> Supprimer le magasin
    </button>
  </div>

  <div class="products-section">
    <h2 class="section-title">Les produits disponibles</h2>

    <div *ngIf="produits.length > 0" class="product-list">
      <div *ngFor="let produit of produits" class="product-card">
        <img [src]="produit.imagePrincipale" alt="{{ produit.titre }}" class="product-image" />
        
        <div class="product-info">
          <h3>{{ produit.titre }}</h3>
          <p class="product-price"><strong>Prix :</strong> {{ produit.prix }} MAD</p>

          <div class="card-buttons">
            <button class="delete-btn" (click)="deleteProduct(produit.idProduit)">
              Supprimer
            </button>
            <button class="details-btn" [routerLink]="['/admin/produit-details', produit.idProduit]">
              Voir Détails
            </button>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="produits.length === 0" class="no-products">
      <p>Aucun produit disponible dans ce magasin pour le moment.</p>
    </div>
  </div>
</div>

<ng-template #errorTemplate>
  <div class="error-container">
    <p class="error">{{ error || 'Aucun magasin trouvé.' }}</p>
  </div>
</ng-template>
